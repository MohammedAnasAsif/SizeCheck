# One-time helper: generates the Flutter platform folders (android/, windows/)
# with the official `flutter create` templates and commits them.
# Safe to delete once app/android and app/windows exist.
name: Bootstrap platform folders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Record Flutter version
        run: |
          flutter --version
          flutter --version --machine > /tmp/flutter_version.json
          cat /tmp/flutter_version.json

      - name: Generate platform folders
        run: |
          mkdir -p app
          cd app
          flutter create \
            --platforms=android,windows \
            --org io.github.mohammedanasasif \
            --project-name sizecheck \
            --description "SizeCheck: one body profile, the right size in every brand." \
            .
          mkdir -p ../tool
          cp /tmp/flutter_version.json ../tool/flutter_version.json

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: generate Flutter android and windows platform folders"
          git push
