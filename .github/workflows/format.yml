# Manually run: formats all Dart code with `dart format` and commits the result.
name: Format code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
      - run: dart format packages/size_engine/lib packages/size_engine/test app/lib app/test
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "Already formatted."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: dart format"
          git push
