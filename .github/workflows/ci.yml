name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  data:
    name: Size chart data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        working-directory: tools
      - name: Validate brand files and check the app bundle is up to date
        run: npm run check
        working-directory: tools

  engine:
    name: Size engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
        working-directory: packages/size_engine
      - run: dart format --output=none --set-exit-if-changed lib test
        working-directory: packages/size_engine
        continue-on-error: true
      - run: dart analyze
        working-directory: packages/size_engine
      - run: dart test
        working-directory: packages/size_engine

  app:
    name: App analyze, test and Android build
    runs-on: ubuntu-latest
    needs: [data, engine]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos
        working-directory: app
      - run: flutter test
        working-directory: app
      - name: Build Android APK (test build)
        run: flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: sizecheck-android-test-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  windows:
    name: Windows build
    runs-on: windows-latest
    needs: [data, engine]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter build windows --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: sizecheck-windows-test-build
          path: app/build/windows/x64/runner/Release
          retention-days: 14
