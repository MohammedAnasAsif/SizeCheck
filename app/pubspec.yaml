publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
